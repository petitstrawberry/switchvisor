[workspace]
members = ["crates/switchvisor-core", "crates/switchvisor-tool", "crates/switchvisor-boot"]
default-members = ["crates/switchvisor-core", "crates/switchvisor-tool"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
switchvisor-core = { path = "crates/switchvisor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[profile.release]
panic = "abort"
overflow-checks = true
