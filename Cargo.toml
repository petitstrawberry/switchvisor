[workspace]
members = ["crates/switchvisor", "crates/switchvisor-tool"]
default-members = ["crates/switchvisor", "crates/switchvisor-tool"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"

[workspace.dependencies]
switchvisor = { path = "crates/switchvisor" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[profile.release]
panic = "abort"
overflow-checks = true
